<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>reservation - katalog</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="split">
    <header>
      <a class="brand" href="index.html">KATALOG</a>
      <nav><a href="index.html">datasets</a> <a href="reservation.html">reservation</a></nav>
      <form id="auth">
        <span id="whoami"></span>
        <button type="button" id="authbtn">sign in</button>
        <div id="authbox" hidden>
          <div class="hint">get your token from the cluster</div>
          <code>cat /capstor/store/cscs/swissai/infra01/users/tchu/tokens/$USER</code>
          <input name="token" placeholder="sk-..." autocomplete="off" spellcheck="false" />
          <div class="poprow">
            <button type="button" name="close">cancel</button>
            <button type="submit">sign in</button>
          </div>
          <div class="err"></div>
        </div>
      </form>
    </header>
    <main>
      <div class="pane left">
        <h1>reservation <span class="sub">SD-69241-apertus-1-5-0 - drag to reserve, click to cancel</span></h1>
        <div id="plotarea">
          <svg id="yaxis"></svg>
          <div id="plotwrap">
            <svg id="plot"></svg>
            <form id="pop" hidden>
              <label>nodes <input name="nodes" type="number" min="1" max="600" value="10" /></label>
              <label>from <input name="from" autocomplete="off" /></label>
              <label>to <input name="to" autocomplete="off" /></label>
              <div class="poprow">
                <button type="button" name="close">cancel</button>
                <button type="submit">book</button>
              </div>
              <div class="err"></div>
            </form>
          </div>
        </div>
      </div>
      <div class="pane right">
        <div id="when"></div>
        <div class="tscroll">
          <table class="res">
            <thead>
              <tr>
                <th class="c-user">username</th>
                <th class="c-used num">used</th>
                <th class="c-reserved num">reserved</th>
                <th class="c-from from">from</th>
                <th class="c-to to">to</th>
                <th class="c-delta num">delta</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/reservation.js"></script>
  </body>
</html>
